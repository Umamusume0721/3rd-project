server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: teamcollab-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/teamcollab_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/*.xml
  type-aliases-package: com.teamcollab.user.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线前改成 NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除：1 已删除，0 未删除
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------- 自定义：JWT 配置 ----------
teamcollab:
  jwt:
    # HS256 要求密钥不短于 32 字节，生产环境改成从环境变量注入
    secret: teamcollab-jwt-secret-key-2026-change-me-in-production
    # Token 有效期（分钟）
    expire-minutes: 120
    # 签发者
    issuer: teamcollab
